<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Glowing Medical Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="200" y="96" width="112" height="320" rx="36" fill="url(#crossGrad)" />
    <!-- Horizontal Bar -->
    <rect x="96" y="200" width="320" height="112" rx="36" fill="url(#crossGrad)" />
  </g>
  
  <!-- Center Accent Heartbeat / Pulse Line in White -->
  <path d="M 170 256 L 210 256 L 236 216 L 268 296 L 294 246 L 314 256 L 342 256" 
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
